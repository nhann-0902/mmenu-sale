<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MMENU - SALE V13.1</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <!-- Link đến file CSS riêng -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- UI OVERLAYS -->
  <div id="globalLoading" class="loading-screen"><div class="spinner"></div><div style="font-weight: 800; color: var(--primary); letter-spacing: 1px; font-size: 11px;">ĐANG XỬ LÝ...</div></div>
  <div id="customPopup" class="custom-popup-overlay">
    <div class="custom-popup-card">
      <div id="popupIcon" style="font-size: 40px; color: var(--info); margin-bottom: 15px;"></div>
      <div id="popupTitle" style="font-weight: 800; font-size: 16px; margin-bottom: 10px; color: var(--primary);">THÔNG BÁO</div>
      <div id="popupMessage" style="font-size: 13px; color: var(--text-light); margin-bottom: 25px; line-height:1.5;">Nội dung</div>
      <button class="btn btn-primary" onclick="App.closePopup()">ĐÓNG VÀ TRỞ LẠI</button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header" id="mainHeader">
    <div style="display: flex; align-items: center;">
      <i class="fa-solid fa-bars hamburger" onclick="App.openSidebar()"></i>
      <span class="hamburger" style="font-weight: 900; font-size: 16px; margin-left: 10px; display: none;">MMENU SALE</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="text-align: right;"><div style="font-size: 9px; font-weight: 800; color: var(--text-light); text-transform: uppercase;">Xin chào</div><div id="userGreet" style="font-weight:900; font-size:13px; color: var(--primary);">BOSS NHÂN</div></div>
      <div style="width: 32px; height: 32px; background: var(--accent); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; font-size: 14px;">N</div>
    </div>
  </header>

  <!-- SIDEBAR -->
  <div id="globalSidebar" class="sidebar-overlay" onclick="App.closeSidebar(event)">
    <div class="sidebar-menu" onclick="event.stopPropagation()">
      <div style="text-align: left; font-size: 18px; color: var(--accent); font-weight: 900; margin-bottom: 25px; padding-left: 10px;"><i class="fa-solid fa-bolt"></i> MMENU SALE</div>
      <div style="font-size: 9px; font-weight: 800; color: var(--text-light); margin-bottom: 8px; padding-left: 10px; letter-spacing: 0.5px;">MENU CHÍNH</div>
      <div class="menu-item active" onclick="App.nav('page-launchpad')"><i class="fa-solid fa-house"></i> Trang chủ</div>
      <div class="menu-item" onclick="App.nav('page-dashboard')"><i class="fa-solid fa-chart-pie"></i> Tổng quan</div>
      <div class="menu-item" onclick="App.nav('page-daily')"><i class="fa-solid fa-pen-to-square"></i> Báo cáo ngày</div>
      <div class="menu-item" onclick="App.nav('page-revenue')"><i class="fa-solid fa-money-bill-trend-up"></i> Báo cáo doanh thu</div>
      <div class="menu-item" onclick="App.nav('page-task-list')"><i class="fa-solid fa-list-check"></i> Kho nhiệm vụ</div>
      <div style="border-top: 1px solid var(--border); margin: 15px 10px;"></div>
      <div class="menu-item" style="color: var(--danger);" onclick="App.showPopup('Chế độ xem trước: Không thể đăng xuất.')"><i class="fa-solid fa-power-off"></i> Đăng xuất</div>
    </div>
  </div>

  <!-- #2. LAUNCHPAD -->
  <section id="page-launchpad" class="page active">
    <div class="container" style="display: flex; flex-direction: column; justify-content: center; min-height: calc(100vh - 120px); max-width: 450px;">
      <div class="title-main" style="text-align: center;">HÔM NAY BẠN CẦN LÀM GÌ?</div>
      <div class="card" style="padding: 20px; background: transparent; box-shadow: none; border: none; margin: 0 auto; width: 100%;">
        <button class="btn btn-outline" style="margin-bottom:10px; padding: 22px;" onclick="App.nav('page-dashboard')"><i class="fa-solid fa-chart-pie" style="color:var(--primary); font-size:16px; margin-right:12px; width:20px;"></i> TỔNG QUAN</button>
        <button class="btn btn-outline" style="margin-bottom:10px; padding: 22px;" onclick="App.nav('page-daily')"><i class="fa-solid fa-pen-to-square" style="color:var(--accent); font-size:16px; margin-right:12px; width:20px;"></i> BÁO CÁO NGÀY</button>
        <button class="btn btn-outline" style="margin-bottom:10px; padding: 22px;" onclick="App.nav('page-revenue')"><i class="fa-solid fa-money-bill-trend-up" style="color:var(--success); font-size:16px; margin-right:12px; width:20px;"></i> DOANH THU & CÔNG NỢ</button>
        <button class="btn btn-outline" style="margin-bottom:10px; padding: 22px;" onclick="App.nav('page-task-list')"><i class="fa-solid fa-list-check" style="color:var(--warning); font-size:16px; margin-right:12px; width:20px;"></i> KHO NHIỆM VỤ</button>
      </div>
    </div>
  </section>

  <!-- CÁC PAGE CÒN LẠI (GIỮ NGUYÊN HTML NHƯ BẠN THẤY Ở FILE CŨ) -->
  <!-- Tôi giữ nguyên nhưng ẩn chúng đi để mô phỏng cho ngắn gọn. Khi đưa lên GitHub, bạn cứ copy nguyên khối HTML từ <section id="page-dashboard"> đến hết <section id="page-task-assign"> dán vào đây -->

  <!-- SUPABASE & CORE SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="core.js"></script>
  <!-- Nhúng các module sau khi bạn tạo (Ví dụ: module_tasks.js) -->
  <script src="module_tasks.js"></script>
  <script src="module_daily.js"></script>
  <script src="module_revenue.js"></script>
  <script src="module_dashboard.js"></script>
</body>
</html>
