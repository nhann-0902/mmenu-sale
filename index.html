<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMENU SALE V13.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="header-content">
                <h2><i class="fa-solid fa-rocket"></i> Launchpad</h2>
                <div class="user-info">Xin chào, Sales Team</div>
            </div>
        </header>

        <main class="fade-in-up">
            <div class="card">
                <h3>Thao tác nhanh (Quick Actions)</h3>
                <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Chọn một module để bắt đầu làm việc</p>
                
                <div class="grid-actions">
                    <button class="action-btn" onclick="alert('Mở Master Dashboard')">
                        <i class="fa-solid fa-chart-pie"></i> Tổng quan C-Level
                    </button>
                    <button class="action-btn" onclick="alert('Mở Báo cáo ngày')">
                        <i class="fa-solid fa-calendar-day"></i> Báo cáo Ngày
                    </button>
                    <button class="action-btn" onclick="alert('Mở Báo cáo doanh thu')">
                        <i class="fa-solid fa-file-invoice-dollar"></i> Doanh thu & Công nợ
                    </button>
                    <button class="action-btn" onclick="window.location.href='tasks.html'">
                        <i class="fa-solid fa-list-check"></i> Kho Nhiệm vụ
                    </button>
                </div>
            </div>

            <div class="card">
                <h3>Test Kết Nối Database</h3>
                <p style="color: #64748b; font-size: 14px; margin-bottom: 15px;">Thử đẩy 1 Task mẫu lên Supabase để kiểm tra luồng dữ liệu.</p>
                <button id="btn-test-task" class="btn-primary">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Gửi Task Thử Nghiệm
                </button>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
