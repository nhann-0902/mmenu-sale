<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Dashboard - MMENU</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .chart-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .chart-card h4 {
            margin-bottom: 15px;
            color: #475569;
            font-size: 14px;
            text-align: center;
        }
        .kpi-board {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .kpi-box {
            flex: 1;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
        }
        .kpi-value {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="header-content">
                <h2>
                    <a href="index.html" style="color: inherit; text-decoration: none; margin-right: 10px;">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <i class="fa-solid fa-chart-pie"></i> Master Dashboard
                </h2>
                <div class="user-info">C-Level (Ban Giám Đốc)</div>
            </div>
        </header>

        <main class="fade-in-up">
            <div class="kpi-board">
                <div class="kpi-box" style="border-left-color: #047857;">
                    <div style="font-size: 13px; color: #64748b; font-weight: 600;">TỔNG DOANH THU</div>
                    <div class="kpi-value" id="kpi-revenue">0 đ</div>
                </div>
                <div class="kpi-box" style="border-left-color: #b91c1c;">
                    <div style="font-size: 13px; color: #64748b; font-weight: 600;">TỔNG CÔNG NỢ</div>
                    <div class="kpi-value" id="kpi-debt">0 đ</div>
                </div>
                <div class="kpi-box" style="border-left-color: #2563eb;">
                    <div style="font-size: 13px; color: #64748b; font-weight: 600;">TỔNG LEAD XỬ LÝ</div>
                    <div class="kpi-value" id="kpi-lead">0</div>
                </div>
            </div>

            <div class="chart-grid">
                <div class="chart-card">
                    <h4>1. Cơ Cấu Sản Phẩm Doanh Thu</h4>
                    <canvas id="chartProduct"></canvas>
                </div>
                <div class="chart-card">
                    <h4>2. Tỷ Trọng Nguồn Khách Hàng</h4>
                    <canvas id="chartSource"></canvas>
                </div>
                <div class="chart-card">
                    <h4>3. Thực Thu vs Công Nợ</h4>
                    <canvas id="chartDebt"></canvas>
                </div>
                <div class="chart-card">
                    <h4>4. Phễu Trạng Thái Lead</h4>
                    <canvas id="chartLeadFunnel"></canvas>
                </div>
                <div class="chart-card">
                    <h4>5. Tiến Độ Nhiệm Vụ (Task)</h4>
                    <canvas id="chartTask"></canvas>
                </div>
                <div class="chart-card">
                    <h4>6. BXH Doanh Số Nhân Sự</h4>
                    <canvas id="chartStaff"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dashboard.js"></script>
</body>
</html>
