<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Nhiệm Vụ - MMENU</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="header-content">
                <h2>
                    <a href="index.html" style="color: inherit; text-decoration: none; margin-right: 10px;">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <i class="fa-solid fa-list-check"></i> Kho Nhiệm Vụ
                </h2>
                <div class="user-info">Cấp Quản Lý</div>
            </div>
        </header>

        <main class="fade-in-up">
            <div class="card">
                <h3><i class="fa-solid fa-plus"></i> Phát hành nhiệm vụ</h3>
                <div class="form-group" style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;">
                    <input type="text" id="task-receiver" placeholder="Giao cho (VD: Sales A)" class="form-control">
                    <input type="text" id="task-content" placeholder="Nội dung công việc" class="form-control" style="flex: 2;">
                    <input type="date" id="task-deadline" class="form-control">
                    <button id="btn-add-task" class="btn-primary">Giao việc</button>
                </div>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3>Danh sách công việc</h3>
                    <button id="btn-refresh" class="btn-secondary"><i class="fa-solid fa-rotate-right"></i> Làm mới</button>
                </div>
                
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Ngày giao</th>
                                <th>Người nhận</th>
                                <th>Nội dung</th>
                                <th>Hạn chót</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="task-table-body">
                            <tr><td colspan="5" style="text-align: center;">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="tasks.js"></script>
</body>
</html>
