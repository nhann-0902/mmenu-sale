<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Ngày - MMENU</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="header-content">
                <h2>
                    <a href="index.html" style="color: inherit; text-decoration: none; margin-right: 10px;">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <i class="fa-solid fa-calendar-day"></i> Báo Cáo Ngày
                </h2>
                <div class="user-info">Sales Team</div>
            </div>
        </header>

        <main class="fade-in-up">
            <div class="card" style="border-left: 4px solid #f59e0b;">
                <h3><i class="fa-solid fa-list-check"></i> Nhiệm vụ của tôi cần xử lý</h3>
                <p style="font-size: 13px; color: #64748b; margin-bottom: 10px;">Danh sách các công việc chưa hoàn thành. Bấm "Tích xong" để cập nhật tiến độ.</p>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Ngày giao</th>
                                <th>Nội dung</th>
                                <th>Hạn chót</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="my-tasks-body">
                            <tr><td colspan="4" style="text-align: center;">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-filter"></i> Báo Cáo Phễu Khách Hàng (Leads)</h3>
                <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">Nhập số liệu khách hàng tìm kiếm và xử lý trong ngày.</p>
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <div>
                        <label style="font-size: 12px; font-weight: 600; color: #475569;">Ngày Báo Cáo</label>
                        <input type="date" id="lead-date" class="form-control" style="width: 100%; margin-top: 5px;">
                    </div>
                    <div>
                        <label style="font-size: 12px; font-weight: 600; color: #475569;">Tổng Lead</label>
                        <input type="number" id="lead-total" class="form-control" style="width: 100%; margin-top: 5px;" min="0">
                    </div>
                    <div>
                        <label style="font-size: 12px; font-weight: 600; color: #475569;">Lead Nhận (từ MKT)</label>
                        <input type="number" id="lead-nhan" class="form-control" style="width: 100%; margin-top: 5px;" min="0">
                    </div>
                    <div>
                        <label style="font-size: 12px; font-weight: 600; color: #475569;">Lead Tự Tìm</label>
                        <input type="number" id="lead-tu" class="form-control" style="width: 100%; margin-top: 5px;" min="0">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px;">
                    <div>
                        <label style="font-size: 12px; font-weight: 600; color: #047857;">Tiềm Năng</label>
                        <input type="number" id="lead-tiemnang" class="form-control" style="width: 100%; margin-top: 5px;" min="0">
                    </div>
                    <div>
                        <label style="font-size: 12px; font-weight: 600; color: #2563eb;">Demo / Gặp</label>
                        <input type="number" id="lead-demo" class="form-control" style="width: 100%; margin-top: 5px;" min="0">
                    </div>
                    <div>
                        <label style="font-size: 12px; font-weight: 600; color: #d97706;">Báo Giá</label>
                        <input type="number" id="lead-baogia" class="form-control" style="width: 100%; margin-top: 5px;" min="0">
                    </div>
                    <div>
                        <label style="font-size: 12px; font-weight: 600; color: #b91c1c;">Từ Chối / Fail</label>
                        <input type="number" id="lead-fail" class="form-control" style="width: 100%; margin-top: 5px;" min="0">
                    </div>
                </div>

                <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
                    <button id="btn-submit-lead" class="btn-primary" style="padding: 12px 30px;">
                        <i class="fa-solid fa-paper-plane"></i> Gửi Báo Cáo Ngày
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="daily.js"></script>
</body>
</html>
